<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ElectroVision - Auditor Visual TIC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a10;
      --card-bg: rgba(17, 21, 34, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
      --text: #f8fafc;
      --muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 40px 16px; min-height: 100vh; display: flex; justify-content: center; }
    .layout { width: 100%; max-width: 800px; }

    .header { text-align: center; margin-bottom: 24px; }
    .badge-top {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      font-size: 0.75rem;
      padding: 4px 12px;
      border-radius: 9999px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    h1 { font-size: 1.8rem; margin: 10px 0 6px; }
    p.sub { color: var(--muted); font-size: 0.95rem; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* Reto 3: Zona Drag & Drop */
    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 14px;
      padding: 30px 20px;
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
      background: rgba(255, 255, 255, 0.01);
    }
    .dropzone:hover, .dropzone.dragover {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.04);
    }
    .dropzone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

    /* Reto 7: Canvas de Marcado */
    .viewer { display: none; margin-top: 16px; text-align: center; }
    canvas {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .toolbar { display: flex; gap: 10px; margin-top: 12px; justify-content: center; }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .field { margin-top: 20px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
    }
    input[type="text"]:focus { outline: none; border-color: var(--accent); }

    .btn-main {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-main:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Reto 5: Caja de Notificaciones / Errores */
    .alert-box {
      display: none;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 0.9rem;
      margin-top: 20px;
      border-left: 4px solid;
    }
    .alert-error { background: rgba(239, 68, 68, 0.15); border-color: var(--danger); color: #fca5a5; }

    /* Reto 6: Estilo de Tarjetas y Badges */
    .results-section { display: none; margin-top: 24px; }
    .general-desc {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .item-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .item-title { font-weight: 700; font-size: 1.05rem; display: flex; justify-content: space-between; align-items: center; }
    
    .badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
    }
    .badge-cat { background: rgba(99, 102, 241, 0.2); color: #818cf8; }
    .badge-Alta { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .badge-Media { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .badge-Baja { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .item-info { font-size: 0.85rem; color: var(--muted); line-height: 1.4; }
  </style>
</head>
<body>

  <div class="layout">
    <div class="header">
      <span class="badge-top">Especialista Hardware & TIC</span>
      <h1>ElectroVision AI</h1>
      <p class="sub">Auditoría visual de circuitos, microcontroladores y sensores con marcado interactivo.</p>
    </div>

    <div class="card">
      <div class="dropzone" id="dropzone">
        <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" />
        <p><strong>Haz clic para examinar</strong> o arrastra una imagen aquí</p>
        <small style="color: var(--muted); margin-top: 6px; display: block;">Formatos aceptados: JPG, PNG o WEBP</small>
      </div>

      <div class="viewer" id="viewer">
        <canvas id="canvasDisplay"></canvas>
        <div class="toolbar">
          <button type="button" class="btn-secondary" id="btnChange">Reemplazar imagen</button>
          <!-- Reto 7: Descarga de imagen procesada -->
          <button type="button" class="btn-secondary" id="btnDownload">Descargar imagen con círculos</button>
        </div>
      </div>

      <div class="field">
        <label for="promptInput">Componente u objeto a localizar y circular:</label>
        <input type="text" id="promptInput" placeholder="Ej: microcontrolador ESP32, sensor FC-28, capacitor, chip..." />
      </div>

      <button class="btn-main" id="btnAnalyze" onclick="analizarHardware()">Auditar y Circular Componentes</button>
      <div class="alert-box" id="errorBox"></div>
    </div>

    <div class="results-section" id="resultsSection">
      <h2 style="font-size: 1.2rem; margin-bottom: 12px;">Resultado de la Inspección</h2>
      <div class="general-desc" id="generalDesc"></div>
      <div class="cards-grid" id="cardsGrid"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
